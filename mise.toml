[tools]
go = "1.26.7"
golangci-lint = "2.13.1"
goreleaser = "2.17.0"
lefthook = "2.1.12"
shellcheck = "0.11.0"

[env]
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build cluster-migrator"
run = "go build -o cluster-migrator ./cmd/cluster-migrator"

[tasks.format]
description = "Check Go formatting"
run = '''
unformatted="$(gofmt -l .)"
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run"

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "shellcheck -x -P .buildkite .buildkite/*.sh .buildkite/steps/*.sh scripts/ci-buildkite-release"

[tasks.lint]
description = "Run all linters"
depends = ["lint:go", "lint:shell"]

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.release-check]
description = "Validate the release configuration"
run = '''
goreleaser check
bash .buildkite/release-test.sh
'''

[tasks.check]
description = "Run all CI checks"
depends = ["format", "lint", "test", "vet", "release-check"]
