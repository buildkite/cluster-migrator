version: 2

builds:
  - main: ./cmd/cluster-migrator
    binary: cluster-migrator
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

release:
  name_template: "{{ .Tag }}"
  target_commitish: "{{ .Commit }}"
  make_latest: legacy

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs(?:\\([^)]*\\))?:"
      - "^test(?:\\([^)]*\\))?:"
      - "^chore(?:\\([^)]*\\))?:"
      - "^ci(?:\\([^)]*\\))?:"
      - "^Merge "
