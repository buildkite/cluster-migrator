steps:
  - label: ":package: Produce portable workload data"
    key: "target-produce"
    command: |
      set -eu
      echo "run=${MIGRATION_WORKLOAD_RUN_ID} sequence=${MIGRATION_WORKLOAD_SEQUENCE} load=${MIGRATION_WORKLOAD_LOAD} queue=target-only"
      buildkite-agent meta-data set "migration-workload-sequence" "${MIGRATION_WORKLOAD_SEQUENCE}"
      mkdir -p migration-workload
      printf '%s\n' "${MIGRATION_WORKLOAD_RUN_ID}:${MIGRATION_WORKLOAD_SEQUENCE}" > migration-workload/payload.txt
      buildkite-agent artifact upload "migration-workload/payload.txt"
      sleep "${MIGRATION_QUICK_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-target-only"
    concurrency: 1
    concurrency_group: "${MIGRATION_WORKLOAD_PREFIX}/local/target"

  - label: ":mag: Verify data on the shared queue"
    key: "target-verify"
    depends_on: "target-produce"
    command: |
      set -eu
      echo "run=${MIGRATION_WORKLOAD_RUN_ID} sequence=${MIGRATION_WORKLOAD_SEQUENCE} queue=shared"
      test "$(buildkite-agent meta-data get migration-workload-sequence)" = "${MIGRATION_WORKLOAD_SEQUENCE}"
      rm -rf migration-workload-download
      mkdir migration-workload-download
      buildkite-agent artifact download "migration-workload/payload.txt" migration-workload-download --step target-produce
      grep -F "${MIGRATION_WORKLOAD_RUN_ID}:${MIGRATION_WORKLOAD_SEQUENCE}" migration-workload-download/migration-workload/payload.txt
      buildkite-agent annotate --style info --context "migration-workload-${MIGRATION_WORKLOAD_SEQUENCE}" "Portable workload checks passed for sequence ${MIGRATION_WORKLOAD_SEQUENCE}"
      sleep "${MIGRATION_MEDIUM_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-shared"
    concurrency: 1
    concurrency_group: "${MIGRATION_WORKLOAD_PREFIX}/local/target"

  - label: ":people_holding_hands: Shared concurrency"
    depends_on: "target-produce"
    command: |
      echo "pipeline=target group=shared sequence=${MIGRATION_WORKLOAD_SEQUENCE}"
      sleep "${MIGRATION_LONG_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-shared"
    concurrency: 2
    concurrency_group: "${MIGRATION_WORKLOAD_PREFIX}/shared/cross-pipeline"
