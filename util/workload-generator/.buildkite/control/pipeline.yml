steps:
  - label: ":repeat: Deterministic fail-once control"
    key: "control-retry"
    command: |
      set -eu
      echo "pipeline=control sequence=${MIGRATION_WORKLOAD_SEQUENCE} retry=$${BUILDKITE_RETRY_COUNT:-0}"
      if [ "$${BUILDKITE_RETRY_COUNT:-0}" -eq 0 ]; then
        echo "Failing the first attempt to exercise automatic retry"
        exit 42
      fi
      sleep "${MIGRATION_QUICK_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-control-only"
    retry:
      automatic:
        - exit_status: 42
          limit: 1

  - label: ":white_check_mark: Control completed"
    depends_on: "control-retry"
    command: |
      echo "Unrelated control completed for sequence ${MIGRATION_WORKLOAD_SEQUENCE}"
      sleep "${MIGRATION_QUICK_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-control-only"
