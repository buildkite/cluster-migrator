steps:
  - label: ":people_holding_hands: Shared queue consumer"
    command: |
      echo "pipeline=shared-consumer group=shared sequence=${MIGRATION_WORKLOAD_SEQUENCE}"
      sleep "${MIGRATION_MEDIUM_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-shared"
    concurrency: 2
    concurrency_group: "${MIGRATION_WORKLOAD_PREFIX}/shared/cross-pipeline"

  - label: ":link: Overlapping peer queue"
    command: |
      echo "pipeline=shared-consumer queue=peer-only sequence=${MIGRATION_WORKLOAD_SEQUENCE}"
      sleep "${MIGRATION_QUICK_SECONDS}"
    agents:
      queue: "${MIGRATION_WORKLOAD_PREFIX}-peer-only"
